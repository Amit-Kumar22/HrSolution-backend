# =====================================================================
# Local development stack.
#
#   docker compose up -d mysql mailhog     # just the dependencies
#   docker compose up -d --build           # everything, including the app
#
# MySQL is published on host port 3307, NOT 3306, so it cannot collide with
# the MySQL you already run locally. Both can be up at once:
#
#   localhost:3306 -> your Homebrew MySQL     (the `local` profile default)
#   localhost:3307 -> this container          (set DB_URL to use it)
#
# Mail goes to MailHog rather than a real SMTP server. Read it at
# http://localhost:8025 - nothing leaves the machine.
# =====================================================================

name: hrsolution

services:

  mysql:
    image: mysql:8.4
    container_name: hrsolution-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hrsolution_db}
      MYSQL_USER: ${MYSQL_USER:-hrsolution}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hrsolutionpassword}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Keep the container's clock in UTC; the application converts to IST for
      # display. Matches spring.jpa.properties.hibernate.jdbc.time_zone=UTC.
      - --default-time-zone=+00:00
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # The app's depends_on waits for this, so it never starts against a MySQL
      # that is still initialising its data directory.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: hrsolution-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP, where the app sends
      - "8025:8025"   # Web UI, where you read what it sent
    logging:
      # MailHog logs every connection; without this the output drowns everything
      # else in `docker compose logs`.
      driver: "none"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrsolution-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Host is the compose service name, and the port is MySQL's internal
      # 3306 - the 3307 mapping only applies from the host.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hrsolution_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: ${MYSQL_USER:-hrsolution}
      DB_PASSWORD: ${MYSQL_PASSWORD:-hrsolutionpassword}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-DEBUG}
      TZ: UTC
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  mysql-data:
    driver: local
