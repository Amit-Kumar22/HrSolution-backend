########################################################################
# DEV profile - shared development server.
#
# Every value comes from the environment with no usable fallback, so a missing
# variable stops the application at startup instead of silently connecting it to
# the wrong database.
########################################################################

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# API docs stay reachable on dev so the team can explore endpoints.
springdoc.api-docs.enabled=true

logging.level.com.hrsolution=${LOG_LEVEL_APP:DEBUG}
