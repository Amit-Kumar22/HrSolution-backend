########################################################################
# LOCAL profile - your machine. This is the default profile.
#
# Points at the MySQL you already run on localhost:3306 (the same arrangement
# as ems-office-project). Create the database once:
#
#   mysql -u root -p -e "CREATE DATABASE hrsolution_local_db \
#       CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
#
# Then export DB_PASSWORD (see .env.example) and run:
#
#   ./mvnw spring-boot:run
#
# To use the containerised MySQL from docker-compose.yml instead, set
# DB_URL=jdbc:mysql://localhost:3307/hrsolution_db - compose publishes MySQL on
# 3307 precisely so it cannot collide with your local server on 3306.
########################################################################

spring.datasource.url=jdbc:mysql://localhost:3306/hrsolution_local_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

#origin.url=http://62.72.57.219:3001/

# Readable SQL in the console while developing. Keep show-sql off in the other
# profiles: it roughly doubles log volume and leaks parameter values.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# The Vite dev server's default origin, ready for whenever a browser client is
# added. Harmless for a backend-only setup.
app.cors.allowed-origins=http://62.72.57.219:3000/

logging.level.com.hrsolution=DEBUG
# Uncomment to see bound statement parameters when debugging a query.
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
