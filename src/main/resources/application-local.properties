########################################################################
# LOCAL profile - your machine. This is the default profile.
#
# Points at the MySQL you already run on localhost:3306 (the same arrangement
# as ems-office-project). Create the database once:
#
#   mysql -u root -p -e "CREATE DATABASE hrsolution_local_db \
#       CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
#
# Then export DB_PASSWORD (see .env.example) and run:
#
#   ./mvnw spring-boot:run
#
# To use the containerised MySQL from docker-compose.yml instead, set
# DB_URL=jdbc:mysql://localhost:3307/hrsolution_db - compose publishes MySQL on
# 3307 precisely so it cannot collide with your local server on 3306.
########################################################################

# The password comes from .env, which is gitignored. Spring loads that file via
# spring.config.import in application.properties, so this works from the IDE and
# from ./mvnw with no extra setup. No fallback on purpose: a missing DB_PASSWORD
# should stop startup with a clear message rather than silently trying to
# connect with an empty password.
spring.datasource.url=jdbc:mysql://localhost:3306/hrsolution_local_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

#origin.url=http://62.72.57.219:3001/

# Readable SQL in the console while developing. Keep show-sql off in the other
# profiles: it roughly doubles log volume and leaks parameter values.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Origins a browser client may call this API from. Credentials are allowed, so
# wildcards are impossible - every origin has to be listed exactly, scheme and
# port included. A frontend developer running Vite (5173) or Create React App /
# Next.js (3000) needs the localhost entries or every request fails CORS
# preflight with 403 before it ever reaches a controller.
#
# 127.0.0.1 and localhost are different origins to a browser, hence both.
# This is the `local` profile only; dev and prod must set CORS_ALLOWED_ORIGINS
# to the real site origin and nothing more.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://62.72.57.219:3000

logging.level.com.hrsolution=DEBUG
# Uncomment to see bound statement parameters when debugging a query.
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
