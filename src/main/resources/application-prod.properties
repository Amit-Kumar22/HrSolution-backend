########################################################################
# PROD profile.
#
# No defaults anywhere: every variable below must be present in the environment
# or the application will not start. That is intentional - a production app that
# boots with a fallback password is worse than one that refuses to boot.
########################################################################

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

########################################################################
# API documentation is switched off in production. Swagger UI enumerates every
# endpoint and request shape, which is reconnaissance handed to an attacker.
# Set SPRINGDOC_ENABLED=true temporarily if you must inspect a live instance.
########################################################################

springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

########################################################################
# Structured JSON logs for ingestion by a log aggregator. Boot 4 emits these
# natively - no logstash encoder dependency needed. The MDC correlation id is
# carried through as a field rather than being embedded in the message text.
########################################################################

logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=production
logging.level.root=WARN
logging.level.com.hrsolution=${LOG_LEVEL_APP:INFO}

# Health details are never shown to an unauthenticated caller in production;
# the probe only needs the aggregate UP/DOWN.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
