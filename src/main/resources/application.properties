########################################################################
# Shared configuration. Profile files (application-{local,dev,prod}.properties)
# add the datasource and override what differs.
#
# RULE: no secret, password, key or statutory rate appears in this repository.
# Everything sensitive is read from an environment variable. Where a default is
# shown after the colon it is a safe local-development value only.
# See .env.example for the full list of variables.
########################################################################

spring.application.name=hrsolution
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
# Do not advertise the server implementation in response headers.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.shutdown=graceful

########################################################################
# Persistence
########################################################################

# validate, never update: the schema is owned by Flyway alone. This setting
# makes the application refuse to start when an entity and its table have
# drifted apart, which is exactly when you want to find out.
spring.jpa.hibernate.ddl-auto=validate

# Deliberately false. With open-in-view enabled, a lazy association silently
# loads during JSON serialisation, which hides N+1 queries until production.
# Off, an unfetched association fails fast in a test instead.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Store every timestamp in UTC regardless of the server's timezone. Conversion
# to Asia/Kolkata happens at display time - see common/util/DateUtils.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# These two MUST be kept in agreement. The Hibernate flag asserts "the pool
# already hands me connections with autocommit off, so skip disabling it", which
# lets Hibernate defer acquiring a connection until the first statement. If the
# pool still has autocommit on, Hibernate never turns it off and every commit
# fails with "Can't call commit when autocommit=true".
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.datasource.hikari.auto-commit=false

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=hrs-pool

########################################################################
# Flyway - the only thing permitted to change the schema
########################################################################

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# Refuse to adopt a non-empty database that has no migration history, rather
# than guessing which migrations already ran.
spring.flyway.baseline-on-migrate=false

########################################################################
# JSON
########################################################################

# Timestamps go out as ISO-8601 UTC (2026-10-06T09:15:42.113Z), not as epoch
# numbers and not pre-formatted in IST. Rendering dd-MM-yyyy in Asia/Kolkata is
# the presentation layer's job; the API stays unambiguous.
#
# NOTE the property path. Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS off
# SerializationFeature onto DateTimeFeature, so the Boot 2/3 spelling
# 'spring.jackson.serialization.write-dates-as-timestamps' no longer resolves
# and fails startup with "No enum constant". Jackson 3 already defaults this to
# false; it is set explicitly to pin the API contract.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

########################################################################
# Errors - handled entirely by common/error/GlobalExceptionHandler
########################################################################

# Spring's own ProblemDetail support stays off so there is exactly one place
# that builds error responses.
spring.mvc.problemdetails.enabled=false

########################################################################
# Uploads
########################################################################

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

########################################################################
# Mail - defaults point at MailHog from docker-compose (no auth, no TLS)
########################################################################

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@hrsolution.local}
app.mail.admin-recipient=${MAIL_ADMIN_RECIPIENT:admin@hrsolution.local}

########################################################################
# Caching - provider chosen here, not in a @Bean, so prod can switch to Redis
########################################################################

spring.cache.type=${CACHE_TYPE:caffeine}
spring.cache.cache-names=companySettings
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m

########################################################################
# Async and scheduled work
########################################################################

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=200
spring.task.execution.thread-name-prefix=hrs-async-
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=hrs-sched-

########################################################################
# Actuator - only health and info are reachable; see SecurityConfig
########################################################################

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# The mail indicator opens an SMTP connection on every health check and reports
# DOWN when it fails. That would let an SMTP outage - or simply MailHog not
# running locally - turn the whole health endpoint red and get the container
# killed by the orchestrator. Email is not a liveness concern here: it is sent
# asynchronously with retries, so the app is healthy without it.
management.health.mail.enabled=false
info.app.name=${spring.application.name}
info.app.description=HR Solutions and Manpower Supply Platform

########################################################################
# API documentation
########################################################################

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.default-produces-media-type=application/json

########################################################################
# Application settings (bound to common/config/AppProperties)
########################################################################

# Comma-separated browser origins allowed to call this API. Empty means none:
# a deployment that forgets to set it fails closed rather than open.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.openapi.title=HR Solution API
app.openapi.version=v1
app.openapi.description=HR Solutions and Manpower Supply Platform. All endpoints are under /api/v1. \
  Errors follow RFC 7807 with an additional errorCode field.
app.openapi.contact-name=${OPENAPI_CONTACT_NAME:}
app.openapi.contact-email=${OPENAPI_CONTACT_EMAIL:}

########################################################################
# Authentication (bound to common/config/AuthProperties)
########################################################################

# --- Access token (RS256 JWT) ---
app.auth.jwt.issuer=${JWT_ISSUER:https://api.hrsolution.local}
app.auth.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.auth.jwt.clock-skew=30s
# Leave BOTH unset in local development and an ephemeral RSA key pair is
# generated at startup - tokens then die with the process, which is fine for
# development. Any other profile refuses to start without them. Generate with:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/jwt-private.pem
#   openssl rsa -pubout -in keys/jwt-private.pem -out keys/jwt-public.pem
app.auth.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
app.auth.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}

# --- Refresh token (opaque, rotated, HttpOnly cookie) ---
app.auth.refresh.ttl=${JWT_REFRESH_TTL:7d}
app.auth.refresh.remember-me-ttl=${JWT_REFRESH_REMEMBER_ME_TTL:30d}
app.auth.refresh.cookie-name=hrs_refresh
app.auth.refresh.cookie-path=/api/v1/auth
# MUST be true anywhere HTTPS is available. False only for plain-HTTP
# localhost, where a Secure cookie would never be sent at all.
app.auth.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh.cookie-same-site=Strict
# Revoked and expired rows are kept this long before the purge job removes
# them, so a suspected token theft can still be investigated after the fact.
app.auth.refresh.retention=30d

# --- Account lockout ---
app.auth.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.auth.lockout.duration=${LOCKOUT_DURATION:15m}

# --- One-shot tokens ---
app.auth.email-verification.ttl=24h
app.auth.email-verification.max-per-hour=5
app.auth.password-reset.ttl=30m
app.auth.password-reset.max-per-hour=3

# --- Rate limits. Each is capacity per period. ---
# NOTE: login-per-email.capacity must stay ABOVE lockout.max-attempts. If the
# rate limit bit first, the fifth wrong password would return 429 and the
# account would never actually lock - letting an attacker guess a few per
# minute indefinitely without ever tripping the lockout.
app.auth.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.auth.rate-limit.login.capacity=20
app.auth.rate-limit.login.period=1m
app.auth.rate-limit.login-per-email.capacity=10
app.auth.rate-limit.login-per-email.period=1m
app.auth.rate-limit.register.capacity=5
app.auth.rate-limit.register.period=1h
app.auth.rate-limit.forgot-password.capacity=5
app.auth.rate-limit.forgot-password.period=1h
app.auth.rate-limit.refresh.capacity=30
app.auth.rate-limit.refresh.period=1m

# --- Initial SUPER_ADMIN, created at startup when both are set ---
# Never written to a migration file: a committed BCrypt hash would be a
# published credential for every deployment of this code.
app.auth.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.auth.super-admin.password=${SUPER_ADMIN_PASSWORD:}

########################################################################
# Mail delivery (bound to AppProperties.Mail)
########################################################################

app.mail.base-url=${MAIL_BASE_URL:http://localhost:8080}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.max-attempts=3
app.mail.retry-delay-millis=2000

########################################################################
# Scheduled jobs. Disabled in tests so background work cannot fire
# mid-assertion.
########################################################################

app.scheduling.enabled=${SCHEDULING_ENABLED:true}

########################################################################
# Logging - the correlation id set by CorrelationIdFilter is printed with
# every line, so one request's output can be grepped out of a busy log.
########################################################################

logging.pattern.level=%5p [%X{correlationId:-no-correlation-id}]
logging.level.root=INFO
logging.level.com.hrsolution=${LOG_LEVEL_APP:INFO}
