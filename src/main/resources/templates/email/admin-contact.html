<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Website contact message</title>
</head>
<body style="margin:0;padding:0;">

<div th:replace="~{email/fragments :: header}"></div>

<h2 style="margin:0 0 16px;font-size:19px;color:#1e3a5f;">Website contact message</h2>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="margin:0 0 20px;font-size:14px;border-collapse:collapse;">
    <tr>
        <td style="padding:8px 0;color:#6b7280;width:140px;">From</td>
        <td style="padding:8px 0;font-weight:bold;" th:text="${name}">Name</td>
    </tr>
    <tr>
        <td style="padding:8px 0;color:#6b7280;">Email</td>
        <td style="padding:8px 0;">
            <a th:href="'mailto:' + ${email}" th:text="${email}" style="color:#1e3a5f;">email</a>
        </td>
    </tr>
    <tr th:if="${phone != null}">
        <td style="padding:8px 0;color:#6b7280;">Phone</td>
        <td style="padding:8px 0;" th:text="${phone}">Phone</td>
    </tr>
    <tr th:if="${subject != null}">
        <td style="padding:8px 0;color:#6b7280;">Subject</td>
        <td style="padding:8px 0;" th:text="${subject}">Subject</td>
    </tr>
</table>

<div style="margin:0 0 20px;padding:14px;background-color:#f4f5f7;border-radius:6px;">
    <p style="margin:0;white-space:pre-line;" th:text="${message}">Message body</p>
</div>

<p style="margin:0;color:#6b7280;font-size:13px;">
    Reply directly to the sender's address above, then mark the message as replied in the portal.
</p>

<div th:replace="~{email/fragments :: footer}"></div>

</body>
</html>
