########################################################################
# TEST profile - used by every integration test.
#
# No datasource is declared here on purpose: it is supplied by the
# Testcontainers @ServiceConnection in support/TestcontainersConfiguration.
#
# ddl-auto stays at the inherited value of 'validate', which is the point of
# these tests - if a Flyway migration and its entity disagree, the context fails
# to start and every integration test fails loudly.
########################################################################

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.cors.allowed-origins=http://localhost:5173

########################################################################
# Authentication
########################################################################

# No keys configured, so JwtConfig generates an ephemeral RSA pair - 'test' is
# one of the two profiles allowed to do that.

# Mail is replaced by a @MockitoBean in the tests that need to read a token out
# of it. Disabled as well, so a test that forgets to mock it logs instead of
# trying to reach an SMTP server that is not there.
app.mail.enabled=false

# Background jobs off: a purge firing mid-assertion could delete the very token
# the test is about to present.
app.scheduling.enabled=false

# Rate limiting stays ENABLED so the filter is genuinely in the chain, but with
# capacities high enough that functional tests never trip it. The limiting
# behaviour itself is covered by RateLimitServiceTest, which is deterministic
# and does not need a clock.
app.auth.rate-limit.login.capacity=1000
app.auth.rate-limit.login-per-email.capacity=1000
app.auth.rate-limit.register.capacity=1000
app.auth.rate-limit.forgot-password.capacity=1000
app.auth.rate-limit.refresh.capacity=1000

# No SUPER_ADMIN seeded: each test creates exactly the accounts it needs, so
# nothing leaks between test classes sharing the container.
app.auth.super-admin.email=
app.auth.super-admin.password=

########################################################################
# Logging - keep the container's own chatter out of the test output.
########################################################################

logging.level.root=WARN
logging.level.com.hrsolution=INFO
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
logging.level.org.flywaydb=INFO
